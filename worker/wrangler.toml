[triggers]
crons = ["0 8 * * *"]          # 08:00 UTC = 09:00 Algeria (UTC+1)

[[kv_namespaces]]
binding = "SUBS"
id = "PASTE_KV_NAMESPACE_ID"   # from: npx wrangler kv namespace create SUBS

[vars]
